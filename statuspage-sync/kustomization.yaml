apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: statuspage
components:
  - ../scheduling
resources:
  - resources.yaml
configMapGenerator:
  - name: statuspage-sync-code
    files:
      - sync.py
      - inventory.py
  - name: statuspage-sync-config
    files:
      - config.json
