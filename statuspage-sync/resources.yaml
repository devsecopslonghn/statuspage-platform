apiVersion: apps/v1
kind: Deployment
metadata:
  name: statuspage-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: statuspage-sync}
  template:
    metadata:
      labels: {app: statuspage-sync}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sync
          image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          command: [python, -B, -u, /app/sync.py]
          args: [--config, /config/config.json, --mode, internal]
          env:
            - name: STATUSPAGE_API_KEY_FILE
              value: /credentials/api-key
            - name: INVENTORY_URL
              value: http://statuspage-collector.statuspage.svc.cluster.local:8082/inventory
            - name: DISCOVERY_CONFIG_PATH
              value: /discovery/policy.json
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: discovery, mountPath: /discovery, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: cluster-ca, mountPath: /trust, readOnly: true}
      volumes:
        - name: cluster-ca
          configMap:
            name: kube-root-ca.crt
        - name: code
          configMap: {name: statuspage-sync-code}
        - name: config
          configMap: {name: statuspage-sync-config}
        - name: discovery
          configMap: {name: statuspage-discovery-config}
        - name: credentials
          secret:
            secretName: statuspage-api-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: statuspage-sync
spec:
  publishNotReadyAddresses: true
  selector: {app: statuspage-sync}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: statuspage-sync
spec:
  podSelector:
    matchLabels: {app: statuspage-sync}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 8080}]
    - from:
        - podSelector:
            matchLabels: {app: statuspage-admin}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: longhorn-system}
      ports: [{protocol: TCP, port: 9500}]
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [monitoring, card-credit, cr7allgoals, fund-management, keycloak]
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 3001}
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9090}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: statuspage}
          podSelector:
            matchLabels: {app: statuspage-collector}
      ports: [{protocol: TCP, port: 8082}]
