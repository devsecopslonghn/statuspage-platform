apiVersion: v1
kind: ServiceAccount
metadata:
  name: statuspage-collector
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: statuspage-collector
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: statuspage-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: statuspage-collector
subjects:
  - kind: ServiceAccount
    name: statuspage-collector
    namespace: statuspage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: statuspage-collector-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-workers
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statuspage-collector
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: statuspage-collector}
  template:
    metadata:
      labels: {app: statuspage-collector}
    spec:
      serviceAccountName: statuspage-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [k8s-worker1, k8s-worker2]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
          command: [python, -B, -u, /collector/collector.py]
          env:
            - {name: SYNC_MODULE_DIR, value: /app}
            - {name: DISCOVERY_CONFIG_PATH, value: /discovery/policy.json}
            - {name: INVENTORY_DB, value: /data/inventory.db}
          ports: [{name: http, containerPort: 8082}]
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: collector-code, mountPath: /collector, readOnly: true}
            - {name: sync-code, mountPath: /app, readOnly: true}
            - {name: discovery, mountPath: /discovery, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      volumes:
        - {name: collector-code, configMap: {name: statuspage-collector-code}}
        - {name: sync-code, configMap: {name: statuspage-sync-code}}
        - {name: discovery, configMap: {name: statuspage-discovery-config}}
        - {name: data, persistentVolumeClaim: {claimName: statuspage-collector-data}}
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
---
apiVersion: v1
kind: Service
metadata:
  name: statuspage-collector
spec:
  publishNotReadyAddresses: true
  selector: {app: statuspage-collector}
  ports: [{name: http, port: 8082, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: statuspage-collector
spec:
  podSelector:
    matchLabels: {app: statuspage-collector}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: statuspage-sync}
        - podSelector:
            matchLabels: {app: statuspage-admin}
      ports: [{protocol: TCP, port: 8082}]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 443}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: statuspage-collector-apiserver-egress
spec:
  endpointSelector:
    matchLabels: {app: statuspage-collector}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [host, remote-node]
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
