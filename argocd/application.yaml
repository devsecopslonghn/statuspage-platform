# Bootstrap this application through the cluster root GitOps repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: statuspage-platform
  namespace: argocd
spec:
  project: drgdevlab
  source:
    repoURL: git@github.com:devsecopslonghn/statuspage-platform.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: statuspage
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
