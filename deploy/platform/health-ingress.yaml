apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: statuspage-sync-health
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: status-sync.apps.drgdevlab.com
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service: {name: statuspage-sync, port: {number: 8080}}
  tls:
    - hosts: [status-sync.apps.drgdevlab.com]
