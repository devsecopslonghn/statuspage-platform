apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../statuspage-sync
  - ../../admin
  - ../platform
  - ../probes
patches:
  - target:
      kind: Deployment
      name: statuspage-sync
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: statuspage-sync-health
        namespace: statuspage
