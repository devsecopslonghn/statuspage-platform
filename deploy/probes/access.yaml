apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-statuspage-probes
  namespace: card-credit
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: statuspage
      podSelector:
        matchLabels:
          app: statuspage-sync
    ports:
    - protocol: TCP
      port: 3001
---
